name: Forge Agent

# Forge (hoangsonww/Forge-Agentic-Coding-CLI) running on GitHub Actions.
#
# Corrections vs. the original spec — each verified against upstream:
#   * There is no `@v1` tag (upstream tags: v0.1.0/v0.1.1/v1.0.0/v1.0.1), and the
#     action file exists only on `master` — tagging v1.0.1 predates it. The
#     runner fails with "Can't find 'action.yml' ... @v1.0.1", so `@master` is used.
#   * `Omar-Azam/forge-agent` and `hoangsonww/Forge-Agentic-Coding-CLI` are two
#     different projects sharing the "Forge" name. Only the latter ships a GitHub
#     Action, and it is the one wired here.
#   * Omar-Azam's agent drives the *free web UIs* of DeepSeek/ChatGPT/Gemini via
#     Playwright and stops on an interactive "LOGIN REQUIRED ... press ENTER"
#     prompt, so it cannot run unattended in CI. Its GHCR image is also private
#     (anonymous pull -> 403). That path is documented, not wired.
#   * The CLI provider value is `openai`, not `openai-compat` (README wording).
#
# Free model path used here: a local model via Ollama. No API key, no cost, no
# network dependency on a third-party inference provider.
#
# Why not a free hosted model: Z.AI's OpenAI-compatible endpoint serves the free
# glm-4.5-flash but is unreliable for Forge — measured 200 OK in 9.5 s with an
# empty `content` (the tokens land in the reasoning channel) and outright hangs
# on retry, which Forge reports as `HeadersTimeoutError` and silently degrades to
# a canned fallback plan. Z.AI also rejects the paid `glm-4.5` with
# `429 Insufficient balance`. A local model removes that failure mode entirely.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Forge. Leave empty for the default plan-mode review."
        required: false
        default: ""
      mode:
        description: "plan (read-only) | balanced | risky"
        required: false
        default: "plan"

permissions:
  contents: write

concurrency:
  group: forge-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and start local model (Ollama)
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "ollama up after ~$((i*3))s"; break
            fi
            sleep 3
          done
          ollama pull qwen2.5-coder:1.5b
          ollama list
          curl -sf http://127.0.0.1:11434/api/tags | head -c 400; echo

      - name: Pre-configure Forge (local provider, no API key)
        run: |
          set -euo pipefail
          npm install -g @hoangsonw/forge
          forge --version
          # CLI-accepted provider names: ollama|anthropic|openai|llamacpp|vllm|lmstudio
          # ("openai-compat" is README wording, not a CLI value.)
          forge config set provider ollama
          for role in architect planner executor reviewer debugger fast code models.planner models.code models.fast; do
            forge config set "${role}" qwen2.5-coder:1.5b 2>/dev/null || true
          done
          for role in planner code fast; do
            forge config set "models.${role}" qwen2.5-coder:1.5b 2>/dev/null || true
          done
          echo "--- provider probe ---"
          forge model list 2>&1 | head -30 || true

      - name: Run Forge
        id: forge
        # Reference must be @master: the action only exists on master. Tag
        # v1.0.1 predates it, and the runner fails with "Can't find 'action.yml'
        # ... for action '.../actions/forge-run@v1.0.1'" (verified). There is
        # also no `v1` tag — upstream tags are v0.1.0/v0.1.1/v1.0.0/v1.0.1.
        uses: hoangsonww/Forge-Agentic-Coding-CLI/actions/forge-run@master
        with:
          task: ${{ github.event.inputs.task || 'Review this repository and produce a short plan listing the three highest-value improvements.' }}
          mode: ${{ github.event.inputs.mode || 'plan' }}
          provider: "ollama"
          fail-on-error: "false"
          cache-forge-home: "true"

      - name: Show Forge outputs
        if: always()
        run: |
          set -uo pipefail
          {
            echo "Forge task ID: ${{ steps.forge.outputs.task-id }}"
            echo "success      : ${{ steps.forge.outputs.success }}"
            echo "summary      : ${{ steps.forge.outputs.summary }}"
            echo "files-changed: ${{ steps.forge.outputs.files-changed }}"
            echo "duration-ms  : ${{ steps.forge.outputs.duration-ms }}"
            echo "cost-usd     : ${{ steps.forge.outputs.cost-usd }}"
            echo "log-path     : ${{ steps.forge.outputs.log-path }}"
          } | tee /tmp/forge_summary.txt
          if [ -n "${{ steps.forge.outputs.log-path }}" ] && [ -f "${{ steps.forge.outputs.log-path }}" ]; then
            echo "--- log tail ---"
            tail -80 "${{ steps.forge.outputs.log-path }}" | tee /tmp/forge_log_tail.txt || true
          fi

      - name: Send result to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::telegram secrets missing - skipping notify"
            exit 0
          fi
          { cat /tmp/forge_summary.txt 2>/dev/null; echo; cat /tmp/forge_log_tail.txt 2>/dev/null; } > /tmp/msg.txt
          python3 scripts/notify.py /tmp/msg.txt "Forge Agent" || true

      - name: Commit result
        if: always()
        run: |
          set -uo pipefail
          mkdir -p runs
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          {
            echo "# Forge run — ${STAMP}"
            echo
            echo '```'
            cat /tmp/forge_summary.txt 2>/dev/null || echo "(no summary)"
            echo '```'
          } > "runs/${STAMP}.md"
          git config user.name  "forge-agent[bot]"
          git config user.email "forge-agent@users.noreply.github.com"
          if [ -z "$(git status --porcelain runs/ 2>/dev/null)" ]; then
            echo "nothing to commit"; exit 0
          fi
          git add -f runs/
          git commit -q -m "run: forge ${STAMP} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q --autostash origin main && git push -q && break
            echo "push attempt $i failed, retrying"; sleep 5
          done
